# CI pipeline for the CLL Strategy 2035 PMO Platform.
#
# Task:         T-003 (Owner RELMGR, Verifier PLATFORM)
# Requirements: NFR-007 (AC-NFR-007-2), SEC-006 (AC-SEC-006-1), NFR-005 (AC-NFR-005-3)
# Tests:        TEST-NFR-007, TEST-SEC-006, TEST-NFR-005
# Evidence:     EV-NFR-007, EV-SEC-006
# Release gate: GATE-0
#
# Stack per decisions/technology-stack.md (D8): .NET 8 API + React/TypeScript SPA.

name: ci

on:
  push:
    branches:
      - main
      - 'openspec/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.21.2'

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore src/CllPmo.Api/CllPmo.Api.csproj
          dotnet restore tests/CllPmo.Api.Tests/CllPmo.Api.Tests.csproj

      - name: Build
        run: dotnet build tests/CllPmo.Api.Tests/CllPmo.Api.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CllPmo.Api.Tests/CllPmo.Api.Tests.csproj --configuration Release --no-build --logger 'trx;LogFileName=api-tests.trx' --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults/
          if-no-files-found: ignore

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  secret-scan:
    name: Secret scanning (SEC-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid GITLEAKS_LICENSE for
      # organization-owned repositories. The CLI has no such restriction, so
      # AC-SEC-006-1 is satisfied without a license dependency.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree and history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  accessibility:
    name: Accessibility smoke (NFR-005)
    runs-on: ubuntu-latest
    needs: web
    # Advisory until GATE-4. AC-NFR-005-3 requires the accessibility check to
    # run in CI; EXD-008 and AC-NFR-005-1/2 require a clean WCAG 2.2 AA audit,
    # which is evidenced at GATE-4 (T-055). Flip continue-on-error to false
    # when the dashboard ships, so the job becomes blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Playwright starts the preview server, waits for the port and tears it
      # down, so no backgrounded process has to survive between steps.
      - name: Run axe against the dashboard shell
        run: npm run test:a11y

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: web/playwright-report/
          if-no-files-found: ignore

  openspec-artifacts:
    name: OpenSpec artifact presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Structural guard only. Full validation is `openspec validate
      # implement-cll-pmo-platform-v1 --strict`, run locally by the change owner.
      - name: Check required change artifacts exist
        run: |
          set -euo pipefail
          change=openspec/changes/implement-cll-pmo-platform-v1
          for f in proposal.md design.md tasks.md manifest.json; do
            test -f "$change/$f" || { echo "missing $change/$f"; exit 1; }
          done
          test -d "$change/specs" || { echo "missing $change/specs"; exit 1; }
          test -d "$change/tasks" || { echo "missing $change/tasks"; exit 1; }
          echo "All required artifacts present."
